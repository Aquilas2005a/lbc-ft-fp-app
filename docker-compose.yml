services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lbc_db}
      POSTGRES_USER: ${POSTGRES_USER:-lbc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lbc_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lbc_user} -d ${POSTGRES_DB:-lbc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
