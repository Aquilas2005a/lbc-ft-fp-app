name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-structure:
    name: Backend structure check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify backend workspace
        run: |
          test -d backend
          test -f .env.example
          python --version

      - name: Prepare for future FastAPI tests
        run: |
          echo "Backend skeleton will be added in T07."
          echo "FastAPI tests will be expanded after the API exists."

