name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lbc_test
          POSTGRES_USER: lbc_user
          POSTGRES_PASSWORD: ci_password
        options: >-
          --health-cmd "pg_isready -U lbc_user -d lbc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://lbc_user:ci_password@localhost:5432/lbc_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: |
          alembic upgrade head
          pytest -q
